version = 1
SPDX-PackageName = "lunar"
SPDX-PackageSupplier = "Yangtse Su <yangtsesu@gmail.com>"
SPDX-PackageDownloadLocation = "https://github.com/YangtseSu/lunar"

# The Markdown here carries its copyright and licence in this file rather than
# in its own header, and not for brevity: `reuse` decides whether a file is
# text by guessing the encoding of its first 2048 bytes, and on the
# CJK-heavy documents below that guess returns no match. The file is then read
# as binary, a header in it is never examined, and `reuse lint` reports it
# unlicensed whatever the header says — `docs/parity.md` and
# `README.zh-CN.md` among them. The wildcard below covers them anyway, so this
# also holds for a Markdown file added later.
#
# The code and configuration files do carry their own `//` / `#` headers,
# which is the REUSE tool's own default and the shape a reader expects. The
# annotation here is additive to those rather than a substitute for them,
# because `precedence = "aggregate"`.
[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Yangtse Su <yangtsesu@gmail.com>"
SPDX-License-Identifier = "GPL-3.0-or-later"
