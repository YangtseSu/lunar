name: CI

on:
  push:
    branches: ["master"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  gates:
    name: fmt, clippy, test
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo and target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Per-job, not shared: a key two jobs write at once makes the second
          # one fail to save — `Unable to reserve cache … another job may be
          # creating this cache` — after uploading the whole archive. The two
          # jobs build different things anyway (clippy and rustfmt artifacts
          # against a plain debug build), so one entry cannot serve both.
          key: ${{ runner.os }}-cargo-gates-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --locked

      - name: Rustfmt
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --locked

      - name: Test
        run: cargo test --locked

  # The READMEs' `console` blocks are executable samples: every `$ lunar …`
  # line has to reproduce the binary's own output byte for byte. The checker
  # is `tools/check_samples.py` and the expectations were copied from runs, so
  # this job fails the moment a document drifts from the tool — or from the
  # other document.
  samples:
    name: README samples
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo and target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-samples-${{ hashFiles('**/Cargo.lock') }}

      # The expectations are `target/debug/lunar` output, so the debug binary
      # is what has to exist.
      - name: Build
        run: cargo build

      - name: Check both READMEs
        run: python3 tools/check_samples.py

  # Copyright and licensing are declared once, in `REUSE.toml`, rather than in
  # 41 file headers — the reason is in that file, and it is a tooling defect
  # rather than a preference. This job is what keeps the declaration honest: a
  # new file, or a dropped annotation, fails here instead of shipping
  # unlicensed. `reuse` comes from the runner's own universe repository, so the
  # check is the distribution's tool and not a version pinned by this repo.
  reuse:
    name: REUSE compliance
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install reuse
        run: sudo apt-get update -qq && sudo apt-get install -y reuse

      - name: Lint
        run: reuse lint
